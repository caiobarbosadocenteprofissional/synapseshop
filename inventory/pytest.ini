[pytest]
# Suíte do microsserviço de inventário. Roda separadamente da suíte principal
# porque o serviço tem dependências próprias (inventory/requirements.txt):
#
#     pytest inventory/tests
#
# O `pythonpath` do pytest 8+ evita depender do `sys.path` hack do conftest.
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -q
markers =
    unit: testes unitários, isolados de I/O
