services:
  api:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      THROTTLE_ANON: ${THROTTLE_ANON:-20/min}
      THROTTLE_USER: ${THROTTLE_USER:-200/min}
      THROTTLE_LOGIN: ${THROTTLE_LOGIN:-5/min}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@synapseshop.local}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@synapseshop.local}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      POSTGRES_USER: ${POSTGRES_USER:-synapseshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory:
    build: ./inventory
    image: synapseshop-inventory:dev
    container_name: synapseshop-inventory
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      POSTGRES_USER: ${POSTGRES_USER:-synapseshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: synapseshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      POSTGRES_USER: ${POSTGRES_USER:-synapseshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapseshop} -d ${POSTGRES_DB:-synapseshop}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: