[pytest]
# A suíte usa settings próprios (banco efémero, cache em memória, mensageria
# desligada) definidos em config/settings_test.py.
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths = tests
norecursedirs = .git .venv __pycache__ migrations docs scripts inventory

# Cobertura ligada por padrão: o mesmo comando que roda a suíte mede a cobertura
# e falha se cair abaixo da meta (ver .coveragerc e README.md).
addopts =
    --cov=services --cov=events --cov=api --cov=config --cov=repositories
    --cov-report=term-missing
    --cov-report=xml

markers =
    unit: testes unitários, isolados de I/O (sem banco sempre que possível)
    integration: testes de integração de ponta a ponta nos endpoints da API
